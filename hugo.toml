baseURL = 'https://nickberardi.com/'
locale = 'en-US'
title = 'Nick Berardi'
theme = 'PaperMod'

[pagination]
  pagerSize = 10

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = 'production'
  title = 'Nick Berardi'
  description = 'Nick Berardi - Software engineer, engineering leader, and writer on AI and engineering leadership.'
  author = 'Nick Berardi'

  defaultTheme = 'light'
  disableThemeToggle = true

  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = false
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.profileMode]
    enabled = false

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/nberardi'

  [[params.socialIcons]]
    name = 'twitter'
    url = 'https://x.com/nberardi'

  [[params.socialIcons]]
    name = 'linkedin'
    url = 'https://linkedin.com/in/nickberardi'

  [params.bio]
    dayJob = "Alexa+, Amazon"
    council = "IPAC, Penn State College of IST"
    philanthropy = "Berardi Student Engagement Center"
    openSource = "Fluent Cassandra, and others"
    availableFor = "Talks, panels, advisory"

  [params.assets]
    favicon = '/favicon.ico'
    favicon16x16 = '/favicon-16x16.png'
    favicon32x32 = '/favicon-32x32.png'
    apple_touch_icon = '/apple-touch-icon.png'

  [params.cover]
    hidden = true
    hiddenInList = true
    hiddenInSingle = true

[menu]
  [[menu.main]]
    identifier = 'posts'
    name = 'Writing'
    url = '/posts/'
    weight = 10

  [[menu.main]]
    identifier = 'speaking'
    name = 'Speaking'
    url = '/speaking/'
    weight = 20

  [[menu.main]]
    identifier = 'archive'
    name = 'Archive'
    url = '/archive/'
    weight = 30

  [[menu.main]]
    identifier = 'about'
    name = 'About'
    url = '/about/'
    weight = 40

  [[menu.main]]
    identifier = 'search'
    name = 'Search'
    url = '/search/'
    weight = 50

[markup]
  [markup.highlight]
    noClasses = true
    style = 'github'
    lineNos = false

[outputFormats.OGCARD]
  mediaType = 'text/html'
  baseName = 'ogcard'
  isPlainText = false
  notAlternative = true

[outputs]
  home = ['HTML', 'RSS', 'JSON', 'OGCARD']

[taxonomies]
  category = 'categories'
  tag = 'tags'
  series = 'series'
