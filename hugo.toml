baseURL = 'https://nberardi.github.io/nickberardi.com/'
languageCode = 'en-us'
title = 'Nick Berardi'
theme = 'PaperMod'

[pagination]
  pagerSize = 10

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = 'production'
  title = 'Nick Berardi'
  description = 'Nick Berardi - Software Developer, Technology Enthusiast'
  author = 'Nick Berardi'
  
  defaultTheme = 'auto'
  disableThemeToggle = false
  
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.profileMode]
    enabled = true
    title = 'Nick Berardi'
    subtitle = 'Software Developer, Technology Enthusiast, and Blogger'
    imageUrl = ''
    imageWidth = 120
    imageHeight = 120
    imageTitle = 'Nick Berardi'
    
    [[params.profileMode.buttons]]
      name = 'Posts'
      url = '/posts/'
    
    [[params.profileMode.buttons]]
      name = 'Tags'
      url = '/tags/'
    
    [[params.profileMode.buttons]]
      name = 'About'
      url = '/about/'

  [params.homeInfoParams]
    Title = 'Hi there 👋'
    Content = 'Welcome to my blog'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/nberardi'

  [[params.socialIcons]]
    name = 'twitter'
    url = 'https://twitter.com/nberardi'

  [[params.socialIcons]]
    name = 'linkedin'
    url = 'https://linkedin.com/in/nickberardi'

  [params.assets]
    favicon = '/favicon.ico'
    favicon16x16 = '/favicon-16x16.png'
    favicon32x32 = '/favicon-32x32.png'
    apple_touch_icon = '/apple-touch-icon.png'

  [params.cover]
    hidden = true
    hiddenInList = true
    hiddenInSingle = true

[menu]
  [[menu.main]]
    identifier = 'home'
    name = 'Home'
    url = '/'
    weight = 10

  [[menu.main]]
    identifier = 'posts'
    name = 'Posts'
    url = '/posts/'
    weight = 20

  [[menu.main]]
    identifier = 'tags'
    name = 'Tags'
    url = '/tags/'
    weight = 30

  [[menu.main]]
    identifier = 'search'
    name = 'Search'
    url = '/search/'
    weight = 40

  [[menu.main]]
    identifier = 'about'
    name = 'About'
    url = '/about/'
    weight = 50

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[taxonomies]
  category = 'categories'
  tag = 'tags'
  series = 'series'
