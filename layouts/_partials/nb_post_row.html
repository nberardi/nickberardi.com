{{- /* Full post row: date, title, description + reading time. Call with a Page: {{ partial "nb_post_row.html" . }} */ -}}
<a class="nb-post-row" href="{{ .RelPermalink }}">
  <span class="nb-post-date">{{ .Date | time.Format "2006·01·02" }}</span>
  <span>
    <span class="nb-post-title">{{ .Title }}</span>
    <span class="nb-post-desc">{{ .Description }} <span class="nb-post-time">{{ .ReadingTime }} min</span></span>
  </span>
</a>
